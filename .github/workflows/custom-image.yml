# Builds this fork's image (the official Dockerfile, amd64 only) into the fork's GitHub registry.
name: Custom image

on:
  push:
    branches: [fonts-v3.1.0]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/embedded/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION_TAG=3.1.0-fonts
          tags: |
            ghcr.io/${{ github.repository_owner }}/stirling-pdf:3.1.0-fonts
            ghcr.io/${{ github.repository_owner }}/stirling-pdf:3.1.0-fonts-${{ github.sha }}
          cache-from: type=gha,scope=custom-image
          cache-to: type=gha,mode=max,scope=custom-image
